<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIGDOC — UX Melhorado</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
:root{
  --primary:#0f766e;
  --primary-light:#14b8a6;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#1e293b;
  --muted:#64748b;
  --border:#e2e8f0;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
.header{
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:white;
  padding:16px 24px;
  font-weight:600;
  font-size:18px;
}

/* LAYOUT */
.container{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:24px;
  padding:24px;
  max-width:1400px;
  margin:auto;
}

@media(max-width:900px){
  .container{grid-template-columns:1fr}
}

/* CARD */
.card{
  background:var(--card);
  border-radius:16px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.05);
  border:1px solid var(--border);
}

.card h3{
  font-size:14px;
  margin-bottom:16px;
}

/* INPUT */
.input-group{margin-bottom:14px}

label{
  font-size:12px;
  color:var(--muted);
  display:block;
  margin-bottom:6px;
}

input,select{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  font-size:13px;
  transition:all .2s;
}

input:focus,select:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(20,184,166,0.2);
}

/* GRID */
.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* BUTTONS */
.actions{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:10px;
}

button{
  border:none;
  border-radius:12px;
  padding:12px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-primary:hover{opacity:.9}

.btn-secondary{
  background:#eef2ff;
}

/* PREVIEW */
.preview{
  background:white;
  border-radius:16px;
  border:1px solid var(--border);
  display:flex;
  flex-direction:column;
}

.preview-header{
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  font-weight:600;
}

.preview-body{
  padding:40px;
  text-align:center;
  color:var(--muted);
}

.empty-icon{
  font-size:40px;
  margin-bottom:10px;
}

/* UX MICRO */
.helper{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

.success{
  background:#ecfdf5;
  color:#065f46;
  padding:8px;
  border-radius:8px;
  font-size:12px;
}

</style>
</head>
<body>

<div class="header">📄 SIGDOC — Geração Inteligente de Documentos</div>

<div class="container">

  <!-- FORM -->
  <div>

    <div class="card">
      <h3>Tipo de Documento</h3>
      <div class="input-group">
        <label>Escolha o tipo</label>
        <select>
          <option>Guia de Férias</option>
          <option>Guia Médica</option>
        </select>
      </div>
    </div>

    <div class="card">
      <h3>Dados Principais</h3>

      <div class="grid-2">
        <div class="input-group">
          <label>Nº Guia</label>
          <input type="number" placeholder="Ex: 12">
        </div>
        <div class="input-group">
          <label>Ano</label>
          <input type="number" value="2026">
        </div>
      </div>

      <div class="input-group">
        <label>Funcionário</label>
        <input type="text" placeholder="Pesquisar nome...">
        <div class="helper">Sugestão automática ao digitar</div>
      </div>

      <div class="input-group">
        <label>Data início</label>
        <input type="date">
      </div>

      <div class="input-group">
        <label>Dias de férias</label>
        <input type="number" disabled>
        <div class="helper">Calculado automaticamente</div>
      </div>

    </div>

    <div class="card actions">
      <button class="btn-primary">Gerar Documento</button>
      <button class="btn-secondary">Guardar</button>
      <button class="btn-secondary">Imprimir</button>
    </div>

  </div>

  <!-- PREVIEW -->
  <div class="preview">
    <div class="preview-header">Pré-visualização</div>
    <div class="preview-body">
      <div class="empty-icon">📄</div>
      Preencha os dados para visualizar
    </div>
  </div>

</div>

</body>
</html>
